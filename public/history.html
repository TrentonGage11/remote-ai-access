<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat History JSON</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-glow bg-glow-a" aria-hidden="true"></div>
    <div class="bg-glow bg-glow-b" aria-hidden="true"></div>

    <main class="app-shell" style="grid-template-columns: 1fr; max-width: 1020px;">
      <section class="workspace" style="min-height: auto;">
        <header class="topbar card">
          <div>
            <h1>Chat History JSON</h1>
            <p>View or export all local chat tabs and messages.</p>
          </div>
          <div class="top-actions">
            <a class="btn btn-soft" href="index.html">Back to Chat</a>
            <button id="themeToggle" class="btn btn-soft" type="button">Dark mode</button>
            <button id="copyBtn" class="btn btn-soft" type="button">Copy JSON</button>
            <button id="downloadBtn" class="btn">Download</button>
          </div>
        </header>

        <section class="card chat-panel" style="min-height: 65vh;">
          <pre id="jsonOutput" style="margin: 0;"></pre>
        </section>
      </section>
    </main>

    <script src="api-auth.js"></script>
    <script type="module" src="history.js"></script>
  </body>
</html>
