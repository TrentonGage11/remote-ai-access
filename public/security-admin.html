<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Security Admin | Remote AI Access</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20260824d" />
  </head>
  <body>
    <div class="bg-glow bg-glow-a" aria-hidden="true"></div>
    <div class="bg-glow bg-glow-b" aria-hidden="true"></div>

    <main class="docs-shell">
      <section class="card reveal" style="--d: 40ms">
        <div class="topbar">
          <div>
            <h1>Security Admin</h1>
            <p>Manage API keys, protected endpoint scopes, and override secrets from a single settings DB.</p>
          </div>
          <div class="top-actions">
            <a class="btn btn-soft" href="/">Chat</a>
            <a class="btn btn-soft" href="api-tools.html">API Tools</a>
          </div>
        </div>
      </section>

      <section class="card reveal" style="--d: 80ms">
        <h2>Admin Access</h2>
        <div class="top-actions">
          <label class="model-field" for="adminTokenInput">
            <span>Admin Token (x-admin-token)</span>
            <input id="adminTokenInput" type="password" placeholder="required for /api/admin/*" />
          </label>
          <button id="saveAdminTokenBtn" class="btn btn-soft" type="button">Save Token</button>
          <button id="loadSettingsBtn" class="btn" type="button">Load Settings</button>
        </div>
      </section>

      <section class="card reveal" style="--d: 110ms">
        <h2>Browser API Key</h2>
        <p class="muted-inline">This sets the API key used by all app pages via automatic fetch header injection.</p>
        <div class="top-actions">
          <label class="model-field" for="browserApiKeyInput">
            <span>API Key Value</span>
            <input id="browserApiKeyInput" type="password" placeholder="used as request header" />
          </label>
          <button id="saveBrowserKeyBtn" class="btn btn-soft" type="button">Save Browser Key</button>
          <button id="clearBrowserKeyBtn" class="btn btn-soft" type="button">Clear Browser Key</button>
        </div>
      </section>

      <section class="card reveal" style="--d: 140ms">
        <h2>Security Settings DB</h2>
        <div class="top-actions">
          <label class="model-field model-check" for="apiKeyAuthEnabledInput">
            <span>Enable API Key Auth</span>
            <input id="apiKeyAuthEnabledInput" type="checkbox" />
          </label>
          <label class="model-field model-check" for="apiKeyRequireHeaderOnlyInput">
            <span>Header-only Keys</span>
            <input id="apiKeyRequireHeaderOnlyInput" type="checkbox" checked />
          </label>
          <label class="model-field" for="apiKeyHeaderNameInput">
            <span>API Key Header Name</span>
            <input id="apiKeyHeaderNameInput" type="text" placeholder="x-api-key" />
          </label>
        </div>

        <label for="apiKeysInput">API Keys (one per line)</label>
        <textarea id="apiKeysInput" rows="5" placeholder="key-one\nkey-two"></textarea>

        <label for="protectedPrefixesInput">Protected Path Prefixes (one per line)</label>
        <textarea id="protectedPrefixesInput" rows="5" placeholder="/api/files\n/api/tests\n/api/session/workspace/git\n/api/notifications"></textarea>

        <label for="exemptPrefixesInput">Exempt Path Prefixes (one per line)</label>
        <textarea id="exemptPrefixesInput" rows="3" placeholder="/api/files/download/public"></textarea>

        <label for="agentOverrideCodeInput">Agent Step Override Code</label>
        <input id="agentOverrideCodeInput" type="password" placeholder="secret unlock code for high step budgets" />

        <label for="uploadBypassCodesInput">Workspace Upload Bypass Codes (CSV workspace:code pairs)</label>
        <textarea id="uploadBypassCodesInput" rows="4" placeholder="default:secret123,alice:another-secret"></textarea>

        <div class="actions" style="margin-top: 10px;">
          <button id="saveSettingsBtn" class="btn" type="button">Save Settings</button>
          <button id="reloadSettingsBtn" class="btn btn-soft" type="button">Reload</button>
          <span id="status" role="status" aria-live="polite"></span>
        </div>
      </section>

      <section class="card reveal" style="--d: 170ms">
        <h2>Current Snapshot</h2>
        <pre id="settingsJson" class="doc-json">Not loaded yet.</pre>
      </section>
    </main>

    <script src="api-auth.js"></script>
    <script type="module" src="security-admin.js"></script>
  </body>
</html>
