<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notifications | Remote AI Access</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-glow bg-glow-a" aria-hidden="true"></div>
    <div class="bg-glow bg-glow-b" aria-hidden="true"></div>

    <main class="docs-shell">
      <section class="card reveal" style="--d: 40ms">
        <div class="topbar">
          <div>
            <h1>Notifications</h1>
            <p>Recent notify_user events generated by the assistant tools.</p>
          </div>
          <div class="top-actions">
            <a class="btn btn-soft" href="index.html">Chat</a>
            <a class="btn btn-soft" href="notification-rules.html">Notification Rules</a>
            <a class="btn btn-soft" href="notification-permission.html">Notification Access</a>
            <button id="refreshNotificationsBtn" class="btn btn-soft" type="button">Refresh</button>
            <button id="themeToggle" class="btn btn-soft" type="button">Dark mode</button>
          </div>
        </div>
      </section>

      <section class="card reveal" style="--d: 90ms">
        <h2>Latest Entries</h2>
        <p id="notificationsStatus" class="muted-inline">Loading...</p>
        <ul id="notificationsList" class="file-list"></ul>
      </section>

      <section class="card reveal" style="--d: 130ms">
        <h2>JSON Preview</h2>
        <pre id="notificationsJson" class="doc-json">Loading...</pre>
      </section>
    </main>

    <script type="module" src="notifications.js"></script>
  </body>
</html>
