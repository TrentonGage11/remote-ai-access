<VirtualHost *:80>
    ServerName playlist.tg11.org
    Redirect permanent / https://playlist.tg11.org/
</VirtualHost>

<VirtualHost *:443>
    ServerName playlist.tg11.org

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/tg11.org.pem
    SSLCertificateKeyFile /etc/apache2/ssl/tg11.org.key

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8790/
    ProxyPassReverse / http://127.0.0.1:8790/

    ErrorLog ${APACHE_LOG_DIR}/playlist.tg11.org-error.log
    CustomLog ${APACHE_LOG_DIR}/playlist.tg11.org-access.log combined
</VirtualHost>