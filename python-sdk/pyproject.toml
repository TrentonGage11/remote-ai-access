[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-ai-access"
version = "0.1.0"
description = "Python client for Remote AI Access API"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "TG11" }
]
dependencies = [
  "requests>=2.31.0",
  "httpx>=0.27.0"
]

[project.urls]
Homepage = "https://ai.tg11.org"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["remote_ai_access*"]
