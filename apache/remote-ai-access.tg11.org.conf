<VirtualHost *:80>
    ServerName ai.tg11.org
    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog ${APACHE_LOG_DIR}/remote_ai_http_error.log
    CustomLog ${APACHE_LOG_DIR}/remote_ai_http_access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName ai.tg11.org

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/tg11.org.pem
    SSLCertificateKeyFile /etc/apache2/ssl/tg11.org.key

    ProxyPreserveHost On
    ProxyRequests Off

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPass        / http://127.0.0.1:8787/
    ProxyPassReverse / http://127.0.0.1:8787/

    ErrorLog ${APACHE_LOG_DIR}/remote_ai_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/remote_ai_ssl_access.log combined
</VirtualHost>
</IfModule>
